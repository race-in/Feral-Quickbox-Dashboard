name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck and shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Bash syntax
        run: bash -n install.sh uninstall.sh tests/smoke.sh scripts/feral-preflight.sh
      - name: ShellCheck
        run: shellcheck --severity=style install.sh uninstall.sh tests/smoke.sh scripts/feral-preflight.sh
      - name: Installer and uninstaller smoke tests
        run: bash tests/smoke.sh
      - name: Help output
        run: |
          bash install.sh --help
          bash uninstall.sh --help
          bash scripts/feral-preflight.sh --help

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace errors
        run: git diff --check
      - name: Verify required project files
        run: |
          test -s README.md
          test -s LICENSE
          test -s NOTICE
          test -s docs/SECURITY.md
          test -s docs/ROADMAP.md
          test -s docs/UPSTREAM-REVIEW.md
          test -s scripts/feral-preflight.sh
