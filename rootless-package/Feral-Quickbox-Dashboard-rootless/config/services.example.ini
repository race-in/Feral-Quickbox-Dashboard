; Feral Quickbox Dashboard - service allow-list (rootless)
; Copy to ~/.config/feral-quickbox/services.ini  (install.sh does this for you).
;
; Only processes owned by YOUR user are ever matched or signalled.
; Commands are split into an argument list and executed WITHOUT a shell:
; no pipes, no &&, no $(...). Use a wrapper script in your home if you need more.
; "~" and $HOME are expanded.  Browser input is never executed - the browser
; only sends a section name (e.g. "rtorrent") and start/stop/restart.
;
; Keys:  label  = name shown in the UI
;        match  = process name (comm or program basename) used to find it
;        start  = command to start it (omit => no Start button)
;        stop   = optional command; default is SIGTERM to the matched processes
;        url    = optional link (path on this host or https://...)
;
; Examples below are commented out - uncomment and adjust what you actually run.

;[rtorrent]
;label = rTorrent
;match = rtorrent
;start = screen -dmS rtorrent rtorrent
;url   = /rutorrent/

;[qbittorrent]
;label = qBittorrent
;match = qbittorrent-nox
;start = qbittorrent-nox -d
;url   = /qbittorrent/

;[deluged]
;label = Deluge daemon
;match = deluged
;start = deluged

;[transmission]
;label = Transmission
;match = transmission-daemon
;start = transmission-daemon
